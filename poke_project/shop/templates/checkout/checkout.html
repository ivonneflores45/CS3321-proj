<!DOCTYPE html>
{% load tailwind_cli %}
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Passion+One:wght@400;700;900&family=Slackey&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="p-0 m-0 font-[PT_Sans]">

    <!-- nav bar -->
    <div class="fixed top-0 left-0 w-full h-24 bg-black flex justify-between items-center px-4 z-[999] font-[Lexend] text-2xl">
        <!-- logo -->
        <div class="flex cursor-pointer items-center gap-2">
            <img src="{% static 'homepage/PokeBid.png'%}" class="h-20"/>
            <span class="text-amber-400 font-[Slackey] text-3xl">PokeBid</span>
        </div>

        <!-- top-right hand side links -->
        <ul class="flex items-center gap-8 list-none text-white">
            <li><a class="transition-colors duration-300 hover:text-orange-300 cursor-pointer"
                href="{% url 'shop-catalog' %}">
                Shop
                </a>
            </li>
            <li>
                <a class="transition-colors duration-300 hover:text-orange-300 cursor-pointer"
                    href="{% url 'shop-cart' %}">
                    Cart
                </a>
            </li>
            <li>
                <a class="bg-amber-400 flex text-white rounded-full px-6 py-2 mr-4 text-2xl cursor-pointer hover:bg-amber-500"
                    href="{% url 'shop-login' %}">
                    Login/Register
                </a>
            </li>
        </ul>
    </div>

    <div class="mt-20 px-20 py-10">
    <form method="POST" class="flex flex-col gap-6">
            {% csrf_token %}

            <!-- cart summary -->
            <div>
                <span class="font-[Lexend] text-3xl font-bold mb-8">Order summary</span>

                <div class="grid grid-cols-2 gap-4 mt-4">
                {% for item in cart_items %}
                    <div class="flex text-xl p-4 gap-4 justify-between border-2 rounded-xl border-slate-200">
                        <div>
                            <img src="{{item.listing.image.url}}" class="w-auto h-10 object-contain "/>
                            <span class="flex items-center justify-center">{{item.listing.title}} (x{{item.quantity}})</span>
                        </div>
                        <span class="flex items-center justify-center">${{item.subtotal}}</span>
                    </div>
                
                {% endfor %}
            </div>

            <!-- total -->
                <div class="mt-4">
                    <span class="pl-5 text-2xl font-bold">Total:</span>
                    <span class="text-2xl">${{total}}</span>
                </div>
            </div>

            <!-- shipping info -->
             <div class="flex flex-row gap-12">
                <div>
                   <span class="font-[Lexend] text-2xl font-bold mb-8">Shipping info</span>
                   <input type="text" name="recipient_name" placeholder="Full Name" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400 mt-4" required>
                   <input type="text" name="address_line1" placeholder="Address 1" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400" required>
                   <input type="text" name="address_line2" placeholder="Address 2" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400">
                   <div class="flex gap-4">
                       <input type="text" name="city" placeholder="city" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400" required>
                       <input type="text" name="zip_code" placeholder="Zip code" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400" required>
                       <input type="text" name="state" placeholder="state" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400" required>
                   </div>


                   <input type="text" name="country" placeholder="country" class="p-2 w-full mb-2 border-2 border-slate-300 outline-none focus:border-slate-400" required>

                </div>

                <!-- payment -->
                 <div>
                   <span class="font-[Lexend] text-2xl font-bold mb-8">payment method</span>

                   <div class="flex p-5 gap-10 text-2xl">
                       <label>
                           <input type="radio" name="payment_method" value="credit" class="accent-amber-400 cursor-pointer" required>
                           Credit
                       </label>

                       <label>
                           <input type="radio" name="payment_method" value="debit" class="accent-amber-400 cursor-pointer" required>
                               Debit
                        </label>
                   </div>
                 </div>

             </div>


              <!-- submit -->
            <div>
                <button type="submit" class="bg-amber-400 flex text-white rounded-full px-6 py-2 text-xl cursor-pointer hover:bg-amber-500">
                 Place order
                </button>
            </div>


        </form>
    </div>
    
</body>
</html>
