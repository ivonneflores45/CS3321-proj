<!DOCTYPE html>
{% load tailwind_cli %}
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBid: Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Passion+One:wght@400;700;900&family=Slackey&display=swap" rel="stylesheet">
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body class="m-0 p-0">
    <!-- everythings labeled, bc tailwind uses class -->

    <!-- 
    Catalog Page front-end
    Author: Ivonne Flores
    Date created: 4/13/2026
    -->

    <!--nav bar-->
    <div class="fixed top-0 left-0 w-full h-24 bg-black flex justify-between items-center px-4 z-[999] font-[Lexend] text-2xl">
        <!-- logo -->
         <a href="{% url 'shop-home' %}">
            <div class="flex cursor-pointer items-center gap-2">
                <img src="{% static 'homepage/PokeBid.png'%}" class="h-20"/>
                <span class="text-[#fdbd0c] font-[Slackey] text-3xl">PokeBid</span>
            </div>
         </a>

         <div class="flex-1 h-12 flex px-12 overflow-hidden rounded-lg">
            <div class="w-4/6 h-full flex items-center bg-white">
                <input class="flex w-full px-4 placeholder:text-zinc-400 text-zinc-700 text-sm focus:outline-none" 
                    type="text" placeholder="Search..">
            </div>

            <!-- WORK IN PROGRESS, set div containers for sort & filter buttons. just for quick visuals -->
            <div class="w-1/6 h-full flex justify-center items-center bg-white border-l-2 border-slate-400">
                sort by
            </div>
            <div class="w-1/6 h-full flex justify-center items-center bg-white border-l-2 border-slate-400">
                filter
            </div>
         </div>

        <!-- top-right hand side links -->
        <ul class="flex justify-center items-center gap-8 list-none text-white">
            <li><a class="text-orange-300 cursor-pointer"
                href="{% url 'shop-catalog' %}">
                Shop
                </a>
            </li>
            <li>
                <a class="transition-colors duration-300 hover:text-orange-300 cursor-pointer"
                    href="{% url 'shop-cart' %}">
                    Cart
                </a>
            </li>
            <li>
                <a class="bg-[#fdbd0c] flex text-white rounded-full px-6 py-2 mr-4 text-2xl cursor-pointer hover:bg-[#fd9b08]"
                    href="{% url 'shop-login' %}">
                    Login/Register
                </a>
            </li>
        </ul>
    </div>

        <!-- CARDS & LISTINGS CONTAINER -->
        <div class="size-auto absolute flex top-35 left-25 right-25">
            <!-- GRID CONTAINER -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 w-full">
                <!-- ACTUAL LISTINGS SQUARES -->
                {% for card in listings %}
                <!-- testing, sends to home, styling hovering -->
                <a href="{% url 'shop-listing' card.id%}">
                    <div class="flex flex-row border-2 border-slate-200 rounded-xl p-7 w-full transition ease duration-300 hover:border-slate-300 hover:shadow-xl">
                        <div class="flex flex-row items-start gap-4">
                            <img src="{{card.image.url}}"
                                class="w-42 h-auto object-contain shrink-0"/>
                        
                            <div class="flex flex-col ml-2 gap-2">
                                <h1 class="font-[PT_Sans] font-bold text-2xl">
                                    {{card.title}}
                                </h1>
                                <span class="font-[PT_Sans] text-lg">
                                    {{card.set_name}}
                                </span>
                                <span class="font-[PT_Sans] text-lg">
                                    ${{card.base_price}}
                                </span>
                            </div>
                        </div>
                    </div>
                </a>
                {% empty %}
                    <p>no listings found</p>
                {% endfor %}

                <!-- JUST TO SEE HOW ALL GRID BOXES FIT, DELETE -->
            </div>
            
        </div>




        {% block content %}

        {% endblock %}
</body>
</html>
